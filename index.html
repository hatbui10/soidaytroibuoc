<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>NEO TREO — trình dựng sơ đồ neo</title>
<style>
  :root{ --bg:#04070b; --ink:#dbe9f2; --dim:#7e95a8; --cy:#5ce1ff; --am:#ffb85c; --line:rgba(120,180,210,.16); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  #stage{position:fixed;inset:0;
    background:radial-gradient(120% 90% at 50% 42%, #0a1420 0%, #060b12 55%, #04070b 100%)}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

  .layer{position:absolute;inset:0;pointer-events:none}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
       padding:clamp(14px,2.4vw,34px) clamp(14px,2.6vw,40px)}
  .brand{display:flex;align-items:center;gap:12px}
  .cat{width:34px;height:34px;flex:0 0 auto;opacity:.9}
  .brand h1{margin:0;font-size:clamp(13px,1.25vw,17px);font-weight:650;letter-spacing:.16em;text-transform:uppercase}
  .brand p{margin:3px 0 0;font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .stats{text-align:right;font-size:11px;letter-spacing:.06em;color:var(--dim);line-height:1.75;
    text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .stats b{color:var(--cy);font-weight:600;font-size:13px;letter-spacing:.04em}
  .stats .warn{color:var(--am)}

  .hintbar{flex:1 0 100%;font-size:10.5px;letter-spacing:.09em;color:var(--dim);text-transform:uppercase;
    border-top:1px solid var(--line);padding-top:9px;margin-top:-2px;line-height:1.5}
  .hintbar b{color:#9fe9ff;font-weight:600}

  .dock{position:absolute;left:50%;bottom:clamp(14px,2.6vw,32px);transform:translate(-50%,0);
    transition:opacity .45s ease, transform .5s cubic-bezier(.22,1,.36,1);
    width:min(860px,calc(100% - 28px));pointer-events:auto;
    display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:13px 18px;border-radius:16px;
    background:linear-gradient(180deg,rgba(14,22,32,.72),rgba(6,11,17,.78));
    border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 22px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05)}
  .dock.hidden{opacity:0;transform:translate(-50%,140%);pointer-events:none}
  .handle{position:absolute;left:50%;bottom:16px;transform:translate(-50%,0);pointer-events:auto;cursor:pointer;
    display:flex;align-items:center;gap:9px;font:inherit;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);background:linear-gradient(180deg,rgba(14,22,32,.82),rgba(6,11,17,.88));
    border:1px solid var(--line);border-radius:999px;padding:9px 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 14px 34px rgba(0,0,0,.5);transition:opacity .35s ease, transform .35s ease, color .2s, border-color .2s}
  .handle:hover{color:var(--ink);border-color:rgba(150,220,255,.45)}
  .handle.hidden{opacity:0;transform:translate(-50%,16px);pointer-events:none}
  .handle b{color:#9fe9ff;font-size:13px;font-weight:600}
  .grp{display:flex;align-items:center;gap:12px;flex:1 1 230px;min-width:210px}
  .grp label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
  .grp output{font-size:12px;color:var(--cy);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent;cursor:grab}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;
    background:linear-gradient(90deg,#2ee6c2,#5ce1ff 55%,#ffb85c);box-shadow:0 0 14px rgba(92,225,255,.35)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;
    background:#0b1219;border:2px solid #9fe9ff;box-shadow:0 0 12px rgba(92,225,255,.55)}
  input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#2ee6c2,#5ce1ff 55%,#ffb85c)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#0b1219;border:2px solid #9fe9ff}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;
    transition:.22s;white-space:nowrap}
  .chip:hover{color:var(--ink);border-color:rgba(150,220,255,.4)}
  .chip[aria-pressed=true]{color:#04121a;background:linear-gradient(180deg,#9beaff,#48cdf5);border-color:transparent;
    box-shadow:0 0 18px rgba(92,225,255,.35)}
  .chip.add{color:#04121a;background:linear-gradient(180deg,#a8f0c8,#4fd39a);border-color:transparent;font-weight:650}
  .chip.add:hover{filter:brightness(1.08)}
  .chip.rm:hover{color:#ffb0b0;border-color:rgba(255,140,140,.55)}

  .panel{position:absolute;right:clamp(14px,2.6vw,40px);top:clamp(120px,17vh,190px);width:290px;
    max-height:min(58vh,520px);display:none;flex-direction:column;pointer-events:auto;
    background:linear-gradient(180deg,rgba(12,20,29,.86),rgba(6,11,17,.9));
    border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 22px 60px rgba(0,0,0,.55)}
  .panel.open{display:flex}
  .panel header{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 14px;border-bottom:1px solid var(--line)}
  .panel header span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .rows{overflow:auto;padding:8px}
  .row{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:10px}
  .row:hover{background:rgba(255,255,255,.035)}
  .row input[type=text]{flex:1;min-width:0;font:inherit;font-size:12px;letter-spacing:.05em;color:var(--ink);
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-transform:uppercase}
  .row input[type=text]:focus{outline:none;border-color:rgba(150,220,255,.55);background:rgba(92,225,255,.07)}
  .row .ang{font-size:10.5px;color:var(--dim);width:42px;text-align:right;font-variant-numeric:tabular-nums}
  .mini{font:inherit;font-size:12px;line-height:1;color:var(--dim);background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:7px;padding:5px 6px;cursor:pointer}
  .mini:hover{color:var(--ink);border-color:rgba(150,220,255,.4)}
  .mini.del:hover{color:#ffb0b0;border-color:rgba(255,140,140,.5)}

  /* ô sửa tên hiện ngay trên bảng */
  .inline-edit{position:absolute;z-index:9;font-family:inherit;font-weight:700;
    font-size:16px;letter-spacing:.04em;text-align:center;text-transform:uppercase;color:#20262c;
    background:linear-gradient(180deg,#eef3f7,#b9c6d1 30%,#87939e 62%,#b3c0ca);
    border:2px solid #0b1620;border-radius:6px;
    box-shadow:0 0 0 3px rgba(92,225,255,.4), 0 10px 30px rgba(0,0,0,.6);padding:0 8px}
  .inline-edit:focus{outline:none}

  body.touch-mode .del, body.touch-mode .ren{opacity:1}

  @media (max-width:620px){
    .brand p{display:none}
    .brand h1{font-size:13px;letter-spacing:.1em}
    .stats{font-size:10px}
    .stats b{font-size:11.5px}
  }
  @media (max-width:760px){
    .hintbar{font-size:9.5px}
    .panel{right:10px;left:10px;width:auto;top:auto;bottom:132px;max-height:42vh}
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1264 843" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Sơ đồ neo treo: người ở giữa, các vòng neo ở eo, dây và móc sắt nối ra các bảng tên quanh vòng tròn"></svg>

  <div class="layer top">
    <div class="brand">
      <svg class="cat" viewBox="0 0 24 24" fill="none" stroke="#7fdcff" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/>
        <path d="M12 3v3.4M12 17.6V21M3 12h3.4M17.6 12H21M5.6 5.6l2.4 2.4M16 16l2.4 2.4M18.4 5.6 16 8M8 16l-2.4 2.4"/>
      </svg>
      <div>
        <h1>Sơ đồ neo treo</h1>
        <p>người · vòng neo · bảng tên quanh vòng tròn · bản v8</p>
      </div>
    </div>
    <div class="stats mono">
      <div>ĐIỂM NEO&nbsp; <b id="sumN">—</b>&nbsp;· &nbsp;DÂY &amp; MÓC&nbsp; <b id="sumN2">—</b></div>
      <div>TỔNG LỰC KÉO&nbsp; <b id="sumF">— N</b></div>
      <div>TRẠNG THÁI&nbsp; <b id="stateTxt">—</b></div>
    </div>
  </div>

  <div class="panel" id="panel">
    <header>
      <span>Danh sách neo</span>
      <button class="chip rm" id="btnDel2" type="button" style="padding:5px 11px">− Xoá dây</button>
      <button class="chip add" id="btnAdd2" type="button" style="padding:5px 11px">＋ Thêm dây</button>
    </header>
    <div class="rows" id="rows"></div>
  </div>

<div class="dock">
    <div class="grp">
      <label for="tension">Lực căng</label>
      <input id="tension" type="range" min="0" max="100" value="97" aria-label="Lực căng dây neo" />
      <output id="tensionOut" class="mono">97%</output>
    </div>
    <div class="chips">
      <button class="chip add" id="btnAdd" type="button">＋ Thêm dây</button>
      <button class="chip rm" id="btnDel" type="button">− Xoá dây</button>
      <button class="chip" id="btnEven" type="button" aria-pressed="false">Chia đều</button>
      <button class="chip" id="btnPanel" type="button" aria-pressed="false">Danh sách</button>
      <button class="chip" id="btnFx" type="button" aria-pressed="true">Hiệu ứng</button>
      <button class="chip" id="btnPng" type="button">⤓ Xuất PNG</button>
    </div>
    <div class="hintbar">Bấm vào bảng để <b>sửa chữ trực tiếp trên bảng</b> · <b>✕</b> xoá dây đó · <b>＋ / −</b> thêm bớt dây — dây mới <b>tự chia đều</b> trên vòng tròn · Phím <b>N</b> = thêm dây</div>
  </div>

  <button class="handle hidden" id="handle" type="button" title="Hiện thanh điều khiển (phím D)"><b>⌃</b> Điều khiển</button>
</div>

<script>

/* ---------- tiện ích ---------- */
function f(n){ return Math.round(n * 100) / 100; }
function rad(d){ return d * Math.PI / 180; }
function deg(r){ return r * 180 / Math.PI; }
function norm(a){ a = ((a + 180) % 360 + 360) % 360 - 180; return a; }
function norm2(v){ var L = Math.hypot(v.x, v.y) || 1; return { x: v.x / L, y: v.y / L }; }

function estWidth(name, fs){
  var s = (name || '').length, fs2 = fs || 24;
  return s * fs2 * 0.66;
}
var _meas = null;
function measureWidth(name, fs){
  if (typeof document === 'undefined') return estWidth(name, fs);
  try{
    if (!_meas){
      _meas = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      _meas.setAttribute('width', '10'); _meas.setAttribute('height', '10');
      _meas.setAttribute('style', 'position:absolute;left:-9999px;top:0;overflow:hidden');
      document.body.appendChild(_meas);
    }
    var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    _meas.appendChild(t);
    t.setAttribute('font-family', 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif');
    t.setAttribute('font-weight', '700');
    t.setAttribute('font-size', (fs || 24) + 'px');
    t.setAttribute('letter-spacing', '0.04em');
    t.textContent = name || 'X';
    var w = 0; try{ w = t.getComputedTextLength(); }catch(e){}
    _meas.removeChild(t);
    return (w && w > 4) ? w : estWidth(name, fs);
  }catch(e){ return estWidth(name, fs); }
}

/* ---------- hình học ---------- */
function crowded(n){ return (360 / Math.max(n, 1)) < 30; }
function ringScale(n){ return n <= 6 ? 1 : (n <= 9 ? 0.87 : (n <= 12 ? 0.78 : (n <= 16 ? 0.66 : 0.58))); }
function ringRadius(n){ return 8.5 * ringScale(n); }
function angleOfPos(p){ return norm(deg(Math.atan2(p.y - C.y, p.x - C.x))); }

/* độ võng tương đối của dây — căng cao thì dây thẳng như trong ảnh */
function sagFrac(i, T, n){
  return Math.pow(Math.max(0, 1 - T), 1.4) * 0.34 * (0.92 + (i % 3) * 0.07);
}
function ropeCtrl(S, A, frac){
  var mx = (S.x + A.x) / 2, my = (S.y + A.y) / 2;
  var dx = A.x - S.x, dy = A.y - S.y, L = Math.hypot(dx, dy) || 1;
  var nx = -dy / L, ny = dx / L;
  if (ny < 0){ nx = -nx; ny = -ny; }
  return { x: mx + nx * frac * L, y: my + ny * frac * L };
}
function ropeD(S, A, frac){
  var c = ropeCtrl(S, A, frac);
  return 'M ' + f(S.x) + ' ' + f(S.y) + ' Q ' + f(c.x) + ' ' + f(c.y) + ' ' + f(A.x) + ' ' + f(A.y);
}
function qPoint(S, A, frac, t){
  var c = ropeCtrl(S, A, frac), mt = 1 - t;
  return { x: mt * mt * S.x + 2 * mt * t * c.x + t * t * A.x,
           y: mt * mt * S.y + 2 * mt * t * c.y + t * t * A.y };
}

         '" x="0" y="0" width="' + VBW + '" height="' + VBH +
         '" preserveAspectRatio="xMidYMid slice"/>' +

         '<rect x="0" y="' + (VBH - 170) + '" width="' + VBW + '" height="170" fill="url(#vigB)"/>' +
         '<rect x="0" y="0" width="90" height="' + VBH + '" fill="url(#vigL)"/>' +

function glowLayer(angles){
  return '<g>' + angles.map(function(a, i){
    var g = geomOf(a);
    return '<circle class="pulse" cx="' + f(g.ring.x) + '" cy="' + f(g.ring.y) + '" r="18" fill="url(#glowAmber)" ' +
           'style="animation-delay:' + f(i * 0.5) + 's"/>';
  }).join('') + '</g>';
}

function geomOf(a){
  var d = { x: Math.cos(rad(a)), y: Math.sin(rad(a)) };
  var ring = { x: WAIST.x + WAIST.rx * d.x, y: WAIST.y + WAIST.ry * d.y };
  return { a: a, d: d, ring: ring };
}

/* vị trí mặc định khớp các bảng trong ảnh nền */
var DEFAULTS = [
  ['ĐAM MÊ',     668,  68, 180, 96,  0, 's'],
  ['TÌNH CẢM',   337, 107, 198, 96,  0, 's'],
  ['DANH TIẾNG', 950, 170, 160, 90,  0, 'g'],
  ['SỰ NGHIỆP',  247, 383, 208, 94,  0, 's'],
  ['GIA ĐÌNH',  1012, 420, 156, 82,  0, 'g'],
  ['KỲ VỌNG',   1025, 578, 158, 76,  0, 'g'],
  ['SỨC KHỎE',   912, 700, 176, 82,  0, 'g'],
  ['TIỀN BẠC',   385, 705, 220, 90,  0, 's'],
  ['NỖI SỢ',     672, 777, 186, 86,  0, 's']
];

var state = {
  T: 0.97,
  mode: 'auto',
  anchors: DEFAULTS.map(function(r){ return { name: r[0], x: r[1], y: r[2], pw: r[3] + 6, ph: r[4] + 6, rot: r[5], tone: r[6] }; })
};

function autoAngle(i){ return autoAngles(state.anchors.length)[i]; }
/* chia sao cho KHOẢNG HỞ giữa các bảng đều nhau trông thấy (bảng nằm ngang
   trên/dưới chiếm cung rộng hơn bảng nằm dọc hai bên) */
var _evenCache = {};
function radiusFor(i, n){ return (crowded(n) && (i % 2)) ? RMID - 70 : RMID + 16; }
function plateAngHalf(a, r){
  var s = Math.abs(Math.sin(rad(a))), c = Math.abs(Math.cos(rad(a)));
  var t = (PLATE_W / 2) * s + (PLATE_H / 2) * c;      /* bề rộng chiếu theo phương tiếp tuyến */
  return deg(Math.atan(t / r));
}
function autoAngles(n){
  if (_evenCache[n]) return _evenCache[n];
  var a = [], i;
  for (i = 0; i < n; i++) a.push(-90 + i * 360 / n);
  for (var it = 0; it < 6; it++){
    var phi = [], sumPhi = 0;
    for (i = 0; i < n; i++){ phi.push(plateAngHalf(a[i], radiusFor(i, n))); sumPhi += phi[i]; }
    var g = (360 - 2 * sumPhi) / n;                   /* khe hở đều giữa các mép bảng */
    var na = [-90];
    for (i = 1; i < n; i++) na.push(na[i - 1] + phi[i - 1] + g + phi[i]);
    a = na;
  }
  /* cân xứng trái–phải qua trục dọc */
  var b = new Array(n);
  b[0] = -90;
  for (i = 1; i <= Math.floor((n - 1) / 2); i++){
    var m = (a[i] + (180 - a[n - i])) / 2;
    b[i] = m; b[n - i] = 180 - m;
  }
  if (n % 2 === 0) b[n / 2] = 90;
  for (i = 0; i < n; i++) b[i] = norm(b[i]);
  _evenCache[n] = b;
  return b;
}
function posOf(i){
    if (state.mode === 'auto'){
      /* bảng ôm sát vòng neon nhưng không tràn mép ảnh */
      return { x: C.x + Math.cos(rad(autoAngle(i))) * radiusFor(i, state.anchors.length),
               y: C.y + Math.sin(rad(autoAngle(i))) * radiusFor(i, state.anchors.length) };
    }
  var o = state.anchors[i];
  return { x: o.x, y: o.y };
}

/* hình học đầy đủ của một neo (dùng vị trí bảng lưu trong state) */
function plateGeom(i){
  var o = state.anchors[i], n = state.anchors.length;
  var pc = posOf(i);
  var g = geomOf(angleOfPos(pc));
  var h = PLATE_H;
  var fs = PLATE_FS;
  var tw = measureWidth(o.name, fs);
  var w = Math.max(PLATE_W, Math.round(tw + PLATE_PAD));
  var dir = norm2({ x: g.ring.x - pc.x, y: g.ring.y - pc.y });
  var t = Math.min(
    Math.abs(dir.x) > 1e-4 ? (w / 2) / Math.abs(dir.x) : 1e9,
    Math.abs(dir.y) > 1e-4 ? (h / 2) / Math.abs(dir.y) : 1e9
  );
  var W = { x: pc.x + dir.x * (t + 6), y: pc.y + dir.y * (t + 6) };
  var u = norm2({ x: W.x - g.ring.x, y: W.y - g.ring.y });
  var off = { x: -u.y, y: u.x }, k = ringScale(n), rh = RHOOK * k;
  var S = { x: g.ring.x + u.x * rh + off.x * HOOK_OFF * k, y: g.ring.y + u.y * rh + off.y * HOOK_OFF * k };
  g.pc = pc; g.w = w; g.h = h; g.fs = fs; g.textW = tw; g.W = W; g.u = u; g.S = S; g.t = t;
  g.rot = state.mode === 'auto' ? 0 : (o.rot || 0);
  g.tone = o.tone || 's';
  g.dist = Math.hypot(pc.x - C.x, pc.y - C.y);
  g.dir = dir;
  return g;
}

/* dây cáp thép + vòng neo + bảng tên — KHÔNG dùng transform (toạ độ tuyệt đối) */
function rotMaker(cx, cy, rot){
  var r = rad(rot), c = Math.cos(r), s = Math.sin(r);
  return function(px, py){ var dx = px - cx, dy = py - cy; return { x: cx + dx * c - dy * s, y: cy + dx * s + dy * c }; };
}
function polyPath(pts, ox, oy){
  ox = ox || 0; oy = oy || 0;
  return 'M ' + pts.map(function(p){ return f(p.x + ox) + ' ' + f(p.y + oy); }).join(' L ') + ' Z';
}
function ropeLayer(names, angles, T){
  return '<g id="ropeLayer">' + angles.map(function(a, i){
    var g = plateGeom(i);
    var r0 = ringRadius(angles.length);
    var frac = sagFrac(i, T, angles.length);
    var d = ropeD(g.S, g.W, frac);
    var h1 = qPoint(g.S, g.W, frac, .035), h2 = qPoint(g.S, g.W, frac, .08);
    var wh = 'M ' + f(h1.x - g.u.y * 5) + ' ' + f(h1.y + g.u.x * 5) + ' L ' + f(h1.x + g.u.y * 5) + ' ' + f(h1.y - g.u.x * 5) +
             ' M ' + f(h2.x - g.u.y * 5) + ' ' + f(h2.y + g.u.x * 5) + ' L ' + f(h2.x + g.u.y * 5) + ' ' + f(h2.y - g.u.x * 5);
    var pw = g.w, ph = g.h, x = g.pc.x, y = g.pc.y;
    var cs = Math.cos(rad(g.a)) >= 0 ? 1 : -1;
    var R = rotMaker(x, y, g.rot);
    var k1 = R(x - pw / 2, y - ph / 2), k2 = R(x + pw / 2, y - ph / 2),
        k3 = R(x + pw / 2, y + ph / 2), k4 = R(x - pw / 2, y + ph / 2);
    var mnx = Math.min(k1.x, k2.x, k3.x, k4.x), mxx = Math.max(k1.x, k2.x, k3.x, k4.x);
    var mny = Math.min(k1.y, k2.y, k3.y, k4.y), mxy = Math.max(k1.y, k2.y, k3.y, k4.y);
    var i1 = R(x - pw / 2 + 5, y - ph / 2 + 4.4), i2 = R(x + pw / 2 - 5, y - ph / 2 + 4.4),
        i3 = R(x + pw / 2 - 5, y + ph / 2 - 4.4), i4 = R(x - pw / 2 + 5, y + ph / 2 - 4.4);
    var rv = [R(x - pw / 2 + 9, y - ph / 2 + 9), R(x + pw / 2 - 9, y - ph / 2 + 9),
              R(x - pw / 2 + 9, y + ph / 2 - 9), R(x + pw / 2 - 9, y + ph / 2 - 9)];
    var pRen = R(x - cs * (pw / 2 + 2), y - ph / 2 - 2);
    var pDel = R(x + cs * (pw / 2 + 2), y - ph / 2 - 2);
    var longText = g.textW > pw - PLATE_PAD + 2;
    var fit = longText ? ' textLength="' + f(pw - PLATE_PAD + 2) + '" lengthAdjust="spacingAndGlyphs"' : '';
    var label = (names[i] || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var base = y + g.fs * 0.36;
    var txtA = '<text x="' + f(x) + '" y="' + f(base) + '" text-anchor="middle" class="plate-text" style="font-size:' + g.fs + 'px"' + fit + '>' + label + '</text>';
    var txtB = '<text x="' + f(x + 0.6) + '" y="' + f(base + 1.2) + '" text-anchor="middle" class="plate-text shine" style="font-size:' + g.fs + 'px"' + fit + '>' + label + '</text>';
    var stem = '';
    if (g.dist > RMID + 24){
      var b0 = { x: C.x + g.d.x * (RMID - 6), y: C.y + g.d.y * (RMID - 6) };
      var b1 = { x: x - g.dir.x * (g.t + 3), y: y - g.dir.y * (g.t + 3) };
      stem = '<path d="M ' + f(b0.x) + ' ' + f(b0.y) + ' L ' + f(b1.x) + ' ' + f(b1.y) + '" stroke="#08131c" stroke-width="10" stroke-linecap="round" opacity=".9"/>' +
             '<path d="M ' + f(b0.x) + ' ' + f(b0.y) + ' L ' + f(b1.x) + ' ' + f(b1.y) + '" stroke="url(#steel)" stroke-width="6.5" stroke-linecap="round"/>';
    }
    var fill = g.tone === 'g' ? 'url(#plateAm)' : 'url(#plate)';
    var platePath = polyPath([k1, k2, k3, k4]);
    var rivets = rv.map(function(p){ return '<circle cx="' + f(p.x) + '" cy="' + f(p.y) + '" r="2.4" fill="#4c5b66"/>'; }).join('');
    return '<g class="rig" data-i="' + i + '">' +
      '<path class="rp rp-shadow" data-r="' + i + '" d="' + d + '"/>' +
      '<path class="rp rp-base"   data-r="' + i + '" d="' + d + '"/>' +
      '<path class="rp rp-core"   data-r="' + i + '" d="' + d + '"/>' +
      '<path class="rp rp-twist"  data-r="' + i + '" d="' + d + '" style="animation-delay:' + f(-i * 0.2) + 's"/>' +
      '<path class="rp rp-hi"     data-r="' + i + '" d="' + d + '"/>' +
      /* vòng neo thép ở eo */
      '<circle cx="' + f(g.ring.x) + '" cy="' + f(g.ring.y) + '" r="' + f(r0 * 1.22) + '" fill="none" stroke="#7de8ff" stroke-width="8" opacity=".14" filter="url(#blurM)"/>' +
      '<circle cx="' + f(g.ring.x) + '" cy="' + f(g.ring.y) + '" r="' + f(r0 * 1.07) + '" fill="#0a141d"/>' +
      '<circle cx="' + f(g.ring.x) + '" cy="' + f(g.ring.y) + '" r="' + f(r0) + '" fill="none" stroke="url(#steel)" stroke-width="' + f(4.2 * ringScale(angles.length)) + '"/>' +
      '<circle cx="' + f(g.ring.x) + '" cy="' + f(g.ring.y) + '" r="' + f(r0) + '" fill="none" stroke="#faffff" stroke-width="1" opacity=".35"/>' +
      /* bảng tên */
      '<g class="plate" data-a="' + i + '">' +
        '<rect class="plate-hit" x="' + f(mnx - 7) + '" y="' + f(mny - 7) + '" width="' + f(mxx - mnx + 14) + '" height="' + f(mxy - mny + 14) + '" rx="9"/>' +
        '<g class="plate-body">' + stem +
          '<path d="' + polyPath([k1, k2, k3, k4], 3, 4) + '" fill="#040a10" opacity=".72"/>' +
          '<path d="' + platePath + '" fill="' + fill + '" stroke="#0b1620" stroke-width="2.4"/>' +
          '<path d="' + platePath + '" fill="url(#plateSheen)"/>' +
          '<path d="' + polyPath([i1, i2, i3, i4]) + '" fill="none" stroke="#5d6f7d" stroke-width="1.2" opacity=".6"/>' +
          rivets +
          txtB + txtA +
        '</g>' +
        '<g class="ren" data-i="' + i + '">' +
          '<circle cx="' + f(pRen.x) + '" cy="' + f(pRen.y) + '" r="10" fill="rgba(8,14,21,.92)" stroke="#9fe9ff" stroke-width="1.4"/>' +
          '<path d="M ' + f(pRen.x - 4) + ' ' + f(pRen.y + 4) + ' L ' + f(pRen.x - 3.1) + ' ' + f(pRen.y + 1.4) + ' L ' + f(pRen.x + 2.2) + ' ' + f(pRen.y - 3.9) + ' L ' + f(pRen.x + 3.9) + ' ' + f(pRen.y - 2.2) + ' L ' + f(pRen.x - 1.4) + ' ' + f(pRen.y + 3.1) + ' Z" fill="none" stroke="#9fe9ff" stroke-width="1.4" stroke-linejoin="round"/>' +
          '<path d="M ' + f(pRen.x + 5) + ' ' + f(pRen.y - 4.6) + ' L ' + f(pRen.x + 6.6) + ' ' + f(pRen.y - 6.2) + '" stroke="#9fe9ff" stroke-width="1.4" stroke-linecap="round"/>' +
          '<title>Đổi tên</title>' +
        '</g>' +
        '<g class="del" data-i="' + i + '">' +
          '<circle cx="' + f(pDel.x) + '" cy="' + f(pDel.y) + '" r="10" fill="rgba(8,14,21,.92)" stroke="#ff9a9a" stroke-width="1.4"/>' +
          '<path d="M ' + f(pDel.x - 3.4) + ' ' + f(pDel.y - 3.4) + ' L ' + f(pDel.x + 3.4) + ' ' + f(pDel.y + 3.4) + ' M ' + f(pDel.x + 3.4) + ' ' + f(pDel.y - 3.4) + ' L ' + f(pDel.x - 3.4) + ' ' + f(pDel.y + 3.4) + '" stroke="#ffb0b0" stroke-width="1.8" stroke-linecap="round"/>' +
          '<title>Xoá dây</title>' +
        '</g>' +
        /* khoen móc cáp ở mép trong bảng */
        '<circle cx="' + f(g.W.x) + '" cy="' + f(g.W.y) + '" r="4.6" fill="none" stroke="#0a141d" stroke-width="6"/>' +
        '<circle cx="' + f(g.W.x) + '" cy="' + f(g.W.y) + '" r="4.6" fill="none" stroke="url(#steel)" stroke-width="3"/>' +
      '</g>' +
    '</g>';
  }).join('') + '</g>';
}

function buildSVG(names, angles, T){
  return defs() + photoLayer() + glowLayer(angles) + ropeLayer(names, angles, T);
}

/* ============================================================
   PHẦN CHẠY — trạng thái, giao diện, tương tác
   ============================================================ */
(function(){
  var scene  = document.getElementById('scene');
  var stage  = document.getElementById('stage');
  var rowsEl = document.getElementById('rows');
  var panel  = document.getElementById('panel');

  function angles(){
    return state.anchors.map(function(o, i){
      return state.mode === 'auto' ? autoAngle(i) : angleOfPos({ x: o.x, y: o.y });
    });
  }
  function forceOf(i){ return Math.round(62 + i * 5 + state.T * 110); }

  var ropePaths, whPaths;

  function render(){
    var A = angles();
    scene.innerHTML = buildSVG(state.anchors.map(function(o){ return o.name; }), A, state.T);
    ropePaths = scene.querySelectorAll('path.rp');
    whPaths   = scene.querySelectorAll('path.wp');
    if (!fxOn) scene.classList.add('no-fx');
    readout(); buildRows();
  }

  function readout(){
    var n = state.anchors.length, total = 0;
    for (var i = 0; i < n; i++) total += forceOf(i);
    document.getElementById('sumN').textContent  = (n < 10 ? '0' : '') + n;
    document.getElementById('sumN2').textContent = (n < 10 ? '0' : '') + n;
    document.getElementById('sumF').textContent  = total + ' N';
    var st = document.getElementById('stateTxt');
    var hot = state.T > 0.82;
    st.textContent = hot ? 'QUÁ TẢI' : (state.T < 0.2 ? 'CHÙNG' : 'ĐANG CĂNG');
    st.className = hot ? '' : 'warn';
    document.getElementById('tensionOut').textContent = Math.round(state.T * 100) + '%';
  }

  /* ---------- danh sách neo ---------- */
  function buildRows(){
    var A = angles();
    rowsEl.innerHTML = state.anchors.map(function(o, i){
      return '<div class="row" data-i="' + i + '">' +
        '<input type="text" value="' + o.name.replace(/"/g, '&quot;') + '" maxlength="22" aria-label="Tên điểm neo" />' +
        '<span class="ang mono">' + Math.round(norm(A[i])) + '°</span>' +
        '<button class="mini del" data-act="del" title="Xoá neo">✕</button>' +
      '</div>';
    }).join('');
  }
  rowsEl.addEventListener('input', function(e){
    var row = e.target.closest('.row'); if (!row) return;
    var i = +row.dataset.i;
    var v = e.target.value.toUpperCase();
    state.anchors[i].name = v || '—';
    refreshQuick();
  });
  rowsEl.addEventListener('change', function(){ render(); });
  rowsEl.addEventListener('click', function(e){
    var b = e.target.closest('.mini'); if (!b) return;
    if (b.dataset.act === 'del') removeAnchor(+b.closest('.row').dataset.i);
  });

  function refreshQuick(){
    var names = state.anchors.map(function(o){ return o.name; });
    scene.querySelectorAll('.plate').forEach(function(g){
      var i = +g.dataset.a;
      g.querySelectorAll('text').forEach(function(t){ t.textContent = names[i]; });
    });
    readout();
  }

  function addAnchor(){
    var nm = 'NEO ' + (state.anchors.length + 1);
    state.mode = 'auto';                    /* thêm mới → TẤT CẢ tự chia đều trên vòng tròn */
    var idx = state.anchors.push({ name: nm, x: C.x, y: C.y - RMID,
      pw: Math.round(estWidth(nm, 26) + 34), ph: 72, rot: 0,
      tone: state.anchors.length % 2 ? 'g' : 's' }) - 1;
    render(); syncChips();
    openEditor(idx);
  }
  function removeAnchor(i){
    if (state.anchors.length <= 1) return;
    state.anchors.splice(i, 1);
    render();
  }

  /* ---------- đổi tên ngay trên bảng ---------- */
  var editing = null;
  function closeEditor(){
    if (!editing) return;
    var el = editing.el;
    editing = null;
    try{ if (el && el.parentNode) el.parentNode.removeChild(el); }catch(e){}
  }
  function openEditor(i){
    closeEditor();
    var m = scene.getScreenCTM();
    if (!m) return;
    var g = plateGeom(i), s = stage.getBoundingClientRect();
    var k = (m.a + m.d) / 2;                                   /* tỉ lệ phóng đại viewBox → màn hình */
    var cx = m.a * g.pc.x + m.c * g.pc.y + m.e - s.left;       /* tâm bảng trên màn hình */
    var cy = m.b * g.pc.x + m.d * g.pc.y + m.f - s.top;
    var w = g.w * k, h = g.h * k;
    var inp = document.createElement('input');
    inp.type = 'text'; inp.maxLength = 22; inp.className = 'inline-edit';
    inp.value = state.anchors[i].name;
    inp.style.left   = (cx - w / 2) + 'px';
    inp.style.top    = (cy - h / 2) + 'px';
    inp.style.width  = w + 'px';
    inp.style.height = h + 'px';
    inp.style.fontSize = Math.max(12, g.fs * k * 0.72) + 'px';
    if (g.rot) inp.style.transform = 'rotate(' + g.rot + 'deg)';
    stage.appendChild(inp);
    editing = { i: i, el: inp };
    inp.focus(); inp.select();
    var orig = state.anchors[i].name;
    function commit(ok){
      if (!editing) return;
      var v = ok ? inp.value.trim().toUpperCase() : '';
      closeEditor();
      if (ok && v && v !== orig){ state.anchors[i].name = v; render(); }
    }
    inp.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); commit(true); }
      else if (e.key === 'Escape'){ e.preventDefault(); commit(false); }
    });
    inp.addEventListener('blur', function(){ commit(true); });
  }

  /* ---------- bấm bảng để sửa chữ trực tiếp (bảng CỐ ĐỊNH, không kéo) ---------- */
  scene.addEventListener('click', function(e){
    var d = e.target.closest('.del');
    if (d){ removeAnchor(+d.dataset.i); return; }
    var r = e.target.closest('.ren');
    if (r){ openEditor(+r.dataset.i); return; }
    var pl = e.target.closest('.plate');
    if (pl) openEditor(+pl.dataset.a);
  });

  /* ---------- điều khiển ---------- */
  var fxOn = true;
  var slider = document.getElementById('tension');
  slider.addEventListener('input', function(){
    state.T = this.value / 100;
    var A = angles();
    for (var i = 0; i < A.length; i++){
      var g = plateGeom(i);
      var frac = sagFrac(i, state.T, A.length), d = ropeD(g.S, g.W, frac);
      ropePaths.forEach(function(p){ if (p.dataset.r === String(i)) p.setAttribute('d', d); });
      var h1 = qPoint(g.S, g.W, frac, .035), h2 = qPoint(g.S, g.W, frac, .08);
      var wh = 'M ' + f(h1.x - g.u.y * 5) + ' ' + f(h1.y + g.u.x * 5) + ' L ' + f(h1.x + g.u.y * 5) + ' ' + f(h1.y - g.u.x * 5) +
               ' M ' + f(h2.x - g.u.y * 5) + ' ' + f(h2.y + g.u.x * 5) + ' L ' + f(h2.x + g.u.y * 5) + ' ' + f(h2.y - g.u.x * 5);
      whPaths.forEach(function(p){ if (p.dataset.w === String(i)) p.setAttribute('d', wh); });
    }
    readout();
  });

  function syncChips(){
    document.getElementById('btnEven').setAttribute('aria-pressed', String(state.mode === 'auto'));
    document.getElementById('btnPanel').setAttribute('aria-pressed', String(panel.classList.contains('open')));
    document.getElementById('btnFx').setAttribute('aria-pressed', String(fxOn));
  }

  var touchMode = (window.matchMedia && window.matchMedia('(hover: none)').matches) ||
                  (navigator.maxTouchPoints || 0) > 0;
  if (touchMode) document.body.classList.add('touch-mode');

  var dockEl = document.querySelector('.dock'), handleEl = document.getElementById('handle');
  var dockTimer = null, dockHover = false, interacting = false;
  function arm(){ clearTimeout(dockTimer); dockTimer = setTimeout(hideDock, 3200); }
  function disarm(){ clearTimeout(dockTimer); }
  function showDock(){
    dockEl.classList.remove('hidden'); handleEl.classList.add('hidden');
    disarm(); if (!dockHover && !interacting) arm();
  }
  function hideDock(){
    if (dockHover || interacting){ arm(); return; }
    dockEl.classList.add('hidden'); handleEl.classList.remove('hidden');
  }
  document.addEventListener('mousemove', function(e){
    if (e.clientY > window.innerHeight - 150 || dockEl.contains(e.target)) showDock();
    else arm();
  });
  dockEl.addEventListener('pointerenter', function(){ dockHover = true; disarm(); });
  dockEl.addEventListener('pointerleave', function(){ dockHover = false; arm(); });
  dockEl.addEventListener('pointerdown',  function(){ interacting = true; disarm(); });
  window.addEventListener('pointerup',   function(){ interacting = false; arm(); });
  handleEl.addEventListener('click', showDock);
  window.addEventListener('keydown', function(e){
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'd' || e.key === 'D') showDock();
  });
  arm();

  document.getElementById('btnAdd').addEventListener('click', addAnchor);
  document.getElementById('btnAdd2').addEventListener('click', addAnchor);
  function removeLast(){ removeAnchor(state.anchors.length - 1); }
  document.getElementById('btnDel').addEventListener('click', removeLast);
  document.getElementById('btnDel2').addEventListener('click', removeLast);
  document.getElementById('btnEven').addEventListener('click', function(){
    state.mode = 'auto'; render(); syncChips();
  });
  document.getElementById('btnPanel').addEventListener('click', function(){
    panel.classList.toggle('open'); syncChips();
  });
  document.getElementById('btnFx').addEventListener('click', function(){
    fxOn = !fxOn; scene.classList.toggle('no-fx', !fxOn); syncChips();
  });
  document.getElementById('btnPng').addEventListener('click', exportPNG);

  /* xuất PNG 2000×1334 theo tỉ lệ ảnh */
  function exportPNG(){
    var A = angles();
    var namesArr = state.anchors.map(function(o){ return o.name; });
    var EW = 2000, EH = Math.round(2000 * VBH / VBW);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ' + VBW + ' ' + VBH + '" width="' + EW + '" height="' + EH + '">' +
              buildSVG(namesArr, A, state.T) + '</svg>';
    var slug = 'so-do-neo-treo.png';
    var url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement('canvas'); cv.width = EW; cv.height = EH;
      var ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, EW, EH);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = slug;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
      }, 'image/png');
    };
    img.onerror = function(){
      var a = document.createElement('a'); a.href = url; a.download = slug.replace('.png', '.svg');
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    };
    img.src = url;
  }

  window.addEventListener('keydown', function(e){
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'n' || e.key === 'N') addAnchor();
  });

  /* ---------- dây rung nhẹ theo lực căng ---------- */
  var t0 = performance.now();
  function frame(now){
    if (!editing){
      var tt = (now - t0) / 1000, A = angles();
      for (var i = 0; i < A.length; i++){
        var g = plateGeom(i);
        var wob = 1 + 0.08 * Math.sin(tt * (1.15 + i * 0.11) + i * 1.7);
        var frac = sagFrac(i, state.T, A.length) * wob, d = ropeD(g.S, g.W, frac);
        ropePaths.forEach(function(p){ if (p.dataset.r === String(i)) p.setAttribute('d', d); });
        var h1 = qPoint(g.S, g.W, frac, .035), h2 = qPoint(g.S, g.W, frac, .08);
        var wh = 'M ' + f(h1.x - g.u.y * 5) + ' ' + f(h1.y + g.u.x * 5) + ' L ' + f(h1.x + g.u.y * 5) + ' ' + f(h1.y - g.u.x * 5) +
                 ' M ' + f(h2.x - g.u.y * 5) + ' ' + f(h2.y + g.u.x * 5) + ' L ' + f(h2.x + g.u.y * 5) + ' ' + f(h2.y - g.u.x * 5);
        whPaths.forEach(function(p){ if (p.dataset.w === String(i)) p.setAttribute('d', wh); });
      }
    }
    requestAnimationFrame(frame);
  }

  render();
  syncChips();
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion) requestAnimationFrame(frame);
})();
</script>
